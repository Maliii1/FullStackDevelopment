<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My bootsrtrap page</title>

    <link rel="stylesheet" href="bootstrap-4.3.1-dist/">
</head>
<body>

    <nav class="navbar navbar-light bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">My Website</span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="text-center mb-5">
            <h1 class="display-5">Welcome to Bootstrap</h1>
            <p class="lead">
                Bootstrap lets build nice looking websites using ready-made clsses.
            </p>
            <button class="btn btn-primary">Click Me</button>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">HTML</h5>
                        <p class="card-text">
                            HTML gives our website its structure.
                        </p>
                        <button class="btn btn-outline-primary">Learn Html</button>
                    </div>
                </div>
            </div>
        </div>

            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">CSS</h5>
                        <p class="card-text">
                            CSS controls how our website looks.
                        </p>
                        <button class="btn btn-outline-primary">Learn CSS</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Bootstrap</h5>
                        <p class="card-text">
                            Bootstrap gives us ready-made styles and components.
                        </p>
                        <button class="btn btn-outline-primary">Learn Bootstrap</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>

</html>
